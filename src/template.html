<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
</head>
<body>
    <div id="content">
        <div class="container">
            <div class="left">
                <div class="header">
                    <div class="logo-container">
                        <img src="./images/todo.jpg" alt="Logo" class="logo">
                    </div>
                    <h3 class="name">To-Do</h3>
                </div>

                <div class="upper">
                    <h3>Home</h3>
                    <hr>
                    <div class="all-tasks">
                        <div class="svg-container">
                            <svg xmlns="http://www.w3.org/2000/svg" height=20 width=20 viewBox="0 0 24 24"><title>book-edit-outline</title><path d="M6 20H11V22H6C4.89 22 4 21.11 4 20V4C4 2.9 4.89 2 6 2H18C19.11 2 20 2.9 20 4V10.3C19.78 10.42 19.57 10.56 19.39 10.74L18 12.13V4H13V12L10.5 9.75L8 12V4H6V20M22.85 13.47L21.53 12.15C21.33 11.95 21 11.95 20.81 12.15L19.83 13.13L21.87 15.17L22.85 14.19C23.05 14 23.05 13.67 22.85 13.47M13 19.96V22H15.04L21.17 15.88L19.13 13.83L13 19.96Z" /></svg>                   
                        </div>
                        <p>All Tasks</p>
                    </div>
                    <div class="today-tasks">
                        <div class="svg-container">
                            <svg xmlns="http://www.w3.org/2000/svg" height=20 width=20 viewBox="0 0 24 24"><title>calendar-today</title><path d="M7,10H12V15H7M19,19H5V8H19M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z" /></svg>
                        </div>
                        <p>Today</p>
                    </div>
                </div>
                

                <div class="projects">
                    <h3>Projects</h3>
                    <hr>
                    <button class="new-project">
                        <svg xmlns="http://www.w3.org/2000/svg" height=20 width=20 viewBox="0 0 24 24"><title>folder-plus-outline</title><path d="M13 19C13 19.34 13.04 19.67 13.09 20H4C2.9 20 2 19.11 2 18V6C2 4.89 2.89 4 4 4H10L12 6H20C21.1 6 22 6.89 22 8V13.81C21.39 13.46 20.72 13.22 20 13.09V8H4V18H13.09C13.04 18.33 13 18.66 13 19M20 18V15H18V18H15V20H18V23H20V20H23V18H20Z" /></svg>
                        <span>New Project</span>
                    </button>
                    <div class="modal">
                        <form id="project-form">
                            <div>
                                <h3>Add Project</h3>
                                <button type="button" class="close-btn">&times;</button>
                            </div>
                            <div>
                                <input type="text"
                                id="project-name"
                                placeholder="Default"
                                maxlength="20"
                                required
                                >
                                <button type="submit" class="add">Add Project</button>

                            </div>
                            
                        </form>
                    </div>
                    <div class="edit-project-modal">
                        <form id="edit-project-form">
                            <div>
                                <h3>Edit Project Name</h3>
                                <button type="button" class="close-edit-btn">&times;</button>
                            </div>
                            <div>
                                <input type="text"
                                id="edit-project-name"
                                maxlength="20"
                                >
                                <button type="submit" class="edit-submit">Done</button>

                            </div>
                            
                        </form>
                    </div>
                    <div id="project-lists">
                    </div>
                    
                </div>

            </div>


            <div class="right">
                <div class="right-heading-container">
                    <h1 class="main-area-heading">All Tasks</h1>
                </div>
                <div class="main-area">
                </div> 
            </div>
        </div>

        <div class="add-todo-modal">
            <form id="add-todo-form">
                <div>
                    <h3>Add Todo</h3>
                    <button type="button" class="close-todo-btn">&times;</button>
                </div>
                <div>
                    <h4>Title</h4>
                    <input 
                    class="todo-title" 
                    type="text"
                    placeholder="What to do"
                    required>
                </div>
                <div>
                    <h4>Description(optional)</h4>
                    <input 
                    class="todo-des" 
                    type="text"
                    placeholder="Details regarding what to do">
                </div>
                <div>
                    <h4>Due Date</h4>
                    <input
                    type="date"
                    class="todo-date">
                </div>
                <div>
                    <h4>Priority</h4>
                    <div class="priority-radios">
                        <div>
                            <input
                            type="radio"
                            id="low-priority"
                            name="priority"
                            value="low">
                            <label for="low-priority">Low</label>  
                        </div>

                        <div>
                            <input 
                            type="radio"
                            id="medium-priority"
                            name="priority"
                            value="medium">
                            <label for="medium-priority">Medium</label>  
                        </div>

                        <div>
                            <input 
                            type="radio"
                            id="high-priority"
                            name="priority"
                            value="high">
                            <label for="high-priority">High</label> 
                        </div>
                    </div>
                </div>
                <div>
                    <button type="submit" class="add-todo">Add</button>
                    <button type="button" class="cancel-todo">Cancel</button>
                </div>
            </form>
        </div>
        
    </div>
</body>
</html>
